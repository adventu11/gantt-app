<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>甘特图</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="甘特图">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#F2F5F5;--panel:#FFFFFF;--head:#F7F9F9;--line:#E3E9E9;--line2:#C9D4D4;
  --ink:#1C2A2D;--ink2:#56686B;--ink3:#8B9C9E;
  --bar:#C4DAEC;--bar-p:#1E9E4A;--sum:#3A5560;--sum-p:#3DD06C;--ms:#2E5A5F;
  --today:#E0522B;--sel:#E2F2EE;--pick:#E09A10;--weekend:rgba(28,42,45,.04);
  --dep:#687A7D;--bad:#D23F3F;--focus:#0F9282;--btn-on:#1C2A2D;--btn-on-ink:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1516;--panel:#151D1F;--head:#1A2427;--line:#243135;--line2:#34454B;
    --ink:#E1EAE9;--ink2:#9DB0AF;--ink3:#6C8083;
    --bar:#3A5266;--bar-p:#4BD37E;--sum:#8FA9B3;--sum-p:#4BD37E;--ms:#9ACFC7;
    --today:#FF7B55;--sel:#1C3330;--pick:#F2B23C;--weekend:rgba(255,255,255,.03);
    --dep:#8FA3A6;--bad:#FF6B6B;--focus:#5FD3C1;--btn-on:#E1EAE9;--btn-on-ink:#151D1F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1516;--panel:#151D1F;--head:#1A2427;--line:#243135;--line2:#34454B;
  --ink:#E1EAE9;--ink2:#9DB0AF;--ink3:#6C8083;
  --bar:#3A5266;--bar-p:#4BD37E;--sum:#8FA9B3;--sum-p:#4BD37E;--ms:#9ACFC7;
  --today:#FF7B55;--sel:#1C3330;--pick:#F2B23C;--weekend:rgba(255,255,255,.03);
  --dep:#8FA3A6;--bad:#FF6B6B;--focus:#5FD3C1;--btn-on:#E1EAE9;--btn-on-ink:#151D1F;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font:12px/1.35 system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  display:flex;flex-direction:column;overflow:hidden;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}

/* toolbar */
.top{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:2px 3px;padding:3px 8px;background:var(--panel);
  border-bottom:1px solid var(--line2);white-space:nowrap}

.top::-webkit-scrollbar{display:none}
.title{font-size:15px;font-weight:650;border:1px solid transparent;background:transparent;width:15em;
  padding:4px 6px;border-radius:5px;flex:none}
.title:hover{border-color:var(--line)}
.title:focus{outline:none;border-color:var(--focus);background:var(--panel)}
.grp{display:flex;align-items:center;gap:1px;padding-left:5px;margin-left:2px;border-left:1px solid var(--line);flex:none}
.b{height:25px;min-width:24px;padding:0 6px;border:1px solid transparent;border-radius:5px;background:transparent;cursor:pointer}
.b:hover{background:var(--sel)}
.b:disabled{opacity:.35;cursor:default;background:transparent}
.b[aria-pressed="true"]{background:var(--btn-on);color:var(--btn-on-ink)}
.b:focus-visible,.sel-in:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.b.danger{color:var(--bad)}
.sel-in{height:25px;border:1px solid var(--line2);border-radius:5px;background:var(--panel);padding:0 4px}
.sync{flex:none;color:var(--ink2);font-weight:600;overflow:hidden;text-overflow:ellipsis;max-width:min(22em,50vw);padding:0 4px 0 2px}
.sync .dot{color:var(--today)}
.sync button{border:0;background:none;color:var(--focus);cursor:pointer;text-decoration:underline;padding:0 0 0 6px;font-size:12px}
.mbox label.ck{display:flex;gap:8px;align-items:center;margin:6px 0 12px}
.mbox .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mbox .two textarea{height:220px}
.mbox .note{color:var(--ink2);font-size:12px;margin:8px 0 0}
.hint{flex:none;display:none;padding:6px 12px;background:var(--pick);color:#1b1300;font-weight:600}
.hint.on{display:block}

/* panes */
main{flex:1;min-height:0;display:flex}
#left{flex:none;min-width:0;display:flex;flex-direction:column;background:var(--panel)}
#split{flex:none;width:7px;cursor:col-resize;background:var(--line);touch-action:none;position:relative}
#split::after{content:"";position:absolute;left:2px;top:50%;width:3px;height:28px;margin-top:-14px;border-radius:2px;background:var(--line2)}
#right{flex:1;min-width:0;background:var(--panel)}
main.p-table #split,main.p-table #right{display:none}
main.p-table #left{flex:1}
main.p-chart #split,main.p-chart #left{display:none}
.sc{height:100%;overflow:auto;position:relative;overscroll-behavior:contain}

/* table */
.lhead,.row{display:grid;grid-template-columns:var(--cols);width:max-content;min-width:100%}
.lhead{position:sticky;top:0;z-index:3;height:30px;background:var(--head);border-bottom:1px solid var(--line2)}
.hc{position:relative;display:flex;align-items:center;padding:0 8px;color:var(--ink2);font-weight:600;border-right:1px solid var(--line)}
.rz{position:absolute;top:0;bottom:0;right:-5px;width:10px;cursor:col-resize;z-index:4;touch-action:none}
.rz::after{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:2px;border-radius:1px;background:var(--line2)}
.rz:hover::after,.rz.on::after{background:var(--focus);top:0;bottom:0}
body.colresize,body.colresize *{cursor:col-resize!important;user-select:none}
.row{height:27px;border-bottom:1px solid var(--line);background:var(--panel)}
.row.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--focus)}
.row.fmt .c input,.row.fmt .c .ro{color:inherit}
.fmtp{min-width:290px}
.fmtp .sw{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.fmtp .sw button{width:22px;height:22px;border-radius:5px;border:1px solid var(--line2);cursor:pointer;padding:0;font-size:12px;line-height:20px}
.fmtp .sw button.on{outline:2px solid var(--focus);outline-offset:1px}
.fmtp .sw input[type=color]{width:26px;height:24px;padding:0;border:1px solid var(--line2);border-radius:5px;background:none;cursor:pointer}
.fmtp .lbl{font-size:12px;color:var(--ink2);margin-top:2px}
.fmtp .scope{display:flex;gap:12px;font-size:12px;color:var(--ink2)}
.fmtp .scope label{display:flex;gap:4px;align-items:center;justify-content:flex-start}
.fmtp .scope input{width:auto;height:auto}
.row.ctx input{color:var(--ink3)}
.hc .hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hc .hf{flex:none;margin-left:2px;border:0;background:none;color:var(--ink3);cursor:pointer;padding:0 3px;border-radius:4px;font-size:11px;height:20px}
.hc .hf:hover{background:var(--sel);color:var(--ink)}
.hc.fon{color:var(--focus)}
.hc.fon .hf{color:var(--focus)}
.pop .olist{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:1px;min-width:210px;margin:0 -4px}
.pop label.ck2{display:flex;justify-content:flex-start;align-items:center;gap:8px;color:var(--ink);padding:4px 6px;border-radius:4px;cursor:pointer}
.pop label.ck2:hover,.pop .fopt:hover{background:var(--sel)}
.pop .ck2 input{width:auto;height:auto;margin:0}
.pop .ck2 em,.pop .fopt em{font-style:normal;color:var(--ink3);font-size:11px;margin-left:auto}
.pop .fopt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:5px 6px;border-radius:4px;cursor:pointer}
.pop .fopt.on{font-weight:650;color:var(--focus)}
.pop .note{color:var(--ink2);font-size:12px;max-width:260px}
.c{display:flex;align-items:center;min-width:0;overflow:hidden;border-right:1px solid var(--line)}
.c input{width:100%;height:100%;border:0;background:transparent;padding:0 8px;outline:none;min-width:0;border-radius:0}
.c input:focus{box-shadow:inset 0 0 0 2px var(--focus);background:var(--panel)}
.c input:disabled{color:var(--ink3)}
.c input[type=date]{font-variant-numeric:tabular-nums}
.c input::placeholder{color:var(--ink3)}
.num{justify-content:center;color:var(--ink3);cursor:pointer;font-variant-numeric:tabular-nums;user-select:none}
.row.src .num{background:var(--pick);color:#1b1300;font-weight:700}
.linking .num{color:var(--ink);text-decoration:underline dotted}
.name{gap:0}
.tog{flex:none;width:18px;height:20px;border:0;background:none;padding:0;color:var(--ink2);cursor:pointer;font-size:11px}
span.tog{cursor:default}
.sum input[data-f="name"]{font-weight:650}
.ro{padding:0 8px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.ro.r{margin-left:0}
.lpad,.rpad{height:40px}
.empty{padding:40px 20px;color:var(--ink2);text-align:center;display:none}
.empty.on{display:block}

/* chart */
#rhead{position:sticky;top:0;z-index:2;background:var(--head);width:max-content}
svg{display:block}
.hd text{fill:var(--ink2);font-size:11px;font-variant-numeric:tabular-nums}
.hd .tt{fill:var(--ink);font-weight:650}
.hd .wk{fill:var(--ink3)}
.gl{stroke:var(--line);stroke-width:1;shape-rendering:crispEdges}
.gl2{stroke:var(--line2);stroke-width:1;shape-rendering:crispEdges}
.we{fill:var(--weekend)}
.rs{fill:var(--sel)}
.tflag rect{fill:var(--today)}
.tflag text{fill:#fff!important;font-weight:650;font-size:10px}
.today{stroke:var(--today);stroke-width:1.5;stroke-dasharray:5 4}
.bar{fill:var(--bar)}
.barp{fill:var(--bar-p)}
.sumb{fill:var(--sum)}
.sump{fill:var(--sum-p)}
.ms{fill:var(--ms)}
.bl{font-size:12px;fill:var(--ink);pointer-events:none}
.bl .bo{fill:var(--ink3)}
#right.lbl-name .bl .bo:not(.bd){display:none}
#right.lbl-none .bl{display:none}
.bl.nm{fill:var(--ink3)}
[data-bar]{cursor:grab;touch-action:none}
.dragging [data-bar]{cursor:grabbing}
.h{fill:transparent;cursor:ew-resize}
.picked .bar,.picked .sumb,.picked .ms{stroke:var(--pick);stroke-width:2.5}
.linking [data-bar]{cursor:crosshair}
.dep{fill:none;stroke:var(--dep);stroke-width:1.3}
.dep.bad{stroke:var(--bad);stroke-dasharray:4 3}
.arh{fill:var(--dep)}
.arb{fill:var(--bad)}
.dep-hit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}
.dep-hit:hover+.dep{stroke-width:2.4}

/* floating */
.pop{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line2);border-radius:8px;
  box-shadow:0 8px 28px rgba(0,0,0,.2);padding:12px;min-width:230px;display:flex;flex-direction:column;gap:8px}
.pop[hidden]{display:none}
.pop .ph{font-weight:650}
.pop label{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--ink2)}
.pop input,.pop select{height:30px;border:1px solid var(--line2);border-radius:5px;background:var(--panel);padding:0 6px;width:130px}
.pop .pa{display:flex;justify-content:flex-end;gap:6px}
.pop .mi{text-align:left;width:100%}
.tip{position:fixed;z-index:40;pointer-events:none;background:var(--ink);color:var(--panel);padding:4px 8px;border-radius:5px;font-size:12px;
  font-variant-numeric:tabular-nums;display:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--panel);
  padding:8px 14px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.mbox{background:var(--panel);border-radius:10px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:18px 20px}
.mbox h2{font-size:16px;margin:0 0 10px}
.mbox table{border-collapse:collapse;width:100%}
.mbox td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.mbox td:first-child{white-space:nowrap;color:var(--ink2);width:1%}
.mbox kbd{font:inherit;border:1px solid var(--line2);border-radius:4px;padding:0 4px;background:var(--head)}
.mbox textarea{width:100%;height:240px;font:12px/1.4 ui-monospace,Consolas,monospace;border:1px solid var(--line2);border-radius:6px;background:var(--head);padding:8px}
.mbox .pa{display:flex;justify-content:flex-end;gap:6px;margin-top:12px}
#printarea{display:none}
.mbox .opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.mbox .opt select{height:30px;border:1px solid var(--line2);border-radius:5px;background:var(--panel);padding:0 6px;min-width:150px}
.mbox .cols{display:flex;flex-wrap:wrap;gap:12px;padding:10px 0}
.mbox .cols label{display:flex;align-items:center;gap:5px}
/* 双击展开编辑 */
.ted{position:fixed;z-index:35;background:var(--panel);border:1px solid var(--focus);border-radius:8px;
  box-shadow:0 8px 28px rgba(0,0,0,.25);padding:8px;display:flex;flex-direction:column;gap:6px}
.ted[hidden]{display:none}
.ted .th{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--ink2)}
.ted textarea{width:100%;resize:vertical;border:1px solid var(--line2);border-radius:5px;background:var(--panel);
  padding:6px 8px;font:inherit;line-height:1.55;outline:none;min-height:56px;max-height:65vh}
.ted textarea:focus{border-color:var(--focus)}
.ted .pa{display:flex;justify-content:flex-end;gap:6px}
/* 预算表 */
:root{--bnz:#FFE7B8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bnz:#4A3A18}}
:root[data-theme="dark"]{--bnz:#4A3A18}
#bsplitH{flex:none;height:6px;cursor:row-resize;background:var(--line);touch-action:none}
#bsplitH[hidden],#budget[hidden]{display:none}
#budget{flex:none;display:flex;flex-direction:column;background:var(--panel);min-height:90px;height:38vh}
.bbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;padding:3px 8px;background:var(--head);border-bottom:1px solid var(--line2)}
.bbar .bttl{font-weight:700;margin-right:6px}
.bbar label{display:flex;align-items:center;gap:3px;color:var(--ink2)}
.bbar input,.bbar select{height:23px;border:1px solid var(--line2);border-radius:5px;background:var(--panel);padding:0 4px}
.bbar .bsep{width:1px;height:16px;background:var(--line2);margin:0 4px}
.bbar .bhint{color:var(--ink3);font-size:11px;margin-left:6px}
#bscroll{flex:1;min-height:0;overflow:auto;position:relative;overscroll-behavior:contain}
#bgrid{position:relative;min-width:100%}
.brow{display:flex;height:26px;border-bottom:1px solid var(--line);width:max-content;min-width:100%}
.brow .blb{position:sticky;left:0;z-index:2;flex:none;width:var(--blw,300px);display:flex;background:var(--panel);border-right:1px solid var(--line2)}
.brow .bnm,.brow .bn{flex:1;min-width:0;border:0;background:transparent;padding:0 8px;outline:none;display:flex;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.brow .bnm:focus{box-shadow:inset 0 0 0 2px var(--focus)}
.brow[data-b]:not(.bgp) .bnm{padding-left:22px}
.brow .bt{flex:none;width:92px;display:flex;align-items:center;justify-content:flex-end;padding:0 8px;border-left:1px solid var(--line);font-variant-numeric:tabular-nums;font-weight:600}
.brow .bc{position:relative;flex:none}
.brow .bx{position:absolute;top:0;height:100%;display:flex;align-items:center;justify-content:center;border:0;border-right:1px solid var(--line);background:transparent;
  font-variant-numeric:tabular-nums;text-align:center;padding:0 3px;overflow:hidden;white-space:nowrap;border-radius:0}
.brow input.bx{outline:none;cursor:text}
.brow input.bx:hover{background:var(--sel)}
.brow input.bx:focus{box-shadow:inset 0 0 0 2px var(--focus);background:var(--panel)}
.brow .bx.nz{background:var(--bnz)}
.brow .bx.neg{color:var(--bad)}
.brow.bh{position:sticky;top:0;z-index:3;background:var(--head);height:22px;font-weight:600;color:var(--ink2);font-size:11px}
.brow.bh .blb{background:var(--head);z-index:4}
.brow.bgp,.brow.bgp .blb{background:var(--head)}
.brow.bgp .bnm,.brow.bgp .bx{font-weight:650}
.brow.btot{position:sticky;bottom:0;z-index:3;background:var(--head);font-weight:700;border-top:1px solid var(--line2)}
.brow.btot .blb{background:var(--head);z-index:4}
.brow.bsel .blb{box-shadow:inset 3px 0 0 var(--focus)}
.btoday{position:absolute;top:0;bottom:0;border-left:1.5px dashed var(--today);z-index:1;pointer-events:none;opacity:.7}
.bempty{padding:14px 16px;color:var(--ink2);position:sticky;left:0;max-width:70vw}
@media print{
  :root{padding:0!important}
  html,body{height:auto;overflow:visible;background:#fff;color:#000}
  body>*{display:none!important}
  body>#printarea{display:block!important}
  #printarea svg{display:block}
}
@media (pointer:coarse){.c input{font-size:16px}}
/* 云同步状态 */
.sync .cl{border:0;background:var(--sel);color:var(--ink2);border-radius:10px;padding:1px 8px;font-size:11px;text-decoration:none;cursor:pointer;margin-left:4px}
.sync .cl.bad{background:var(--bad);color:#fff}
.cbtns{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.cbtns .b{height:34px;border:1px solid var(--line2);text-align:left}
.cl-list{max-height:55vh;margin:0}
/* 任务详情编辑 */
.tsf{display:flex;flex-direction:column;gap:9px}
.tsf label{display:flex;flex-direction:column;gap:3px;color:var(--ink2);font-size:12px}
.tsf label.ck{flex-direction:row;align-items:center;gap:6px;margin:0}
.tsf input:not([type=checkbox]),.tsf textarea{height:34px;border:1px solid var(--line2);border-radius:6px;background:var(--panel);padding:0 8px;color:var(--ink);font-size:14px;width:100%}
.tsf textarea{height:auto;min-height:70px;padding:6px 8px;font:inherit;font-size:14px}
.tsrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tsf .lbl{font-size:12px;color:var(--ink2);margin-bottom:-4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:var(--panel);border-radius:14px;padding:4px 11px;cursor:pointer;font-size:13px}
.chip.on{background:var(--focus);border-color:var(--focus);color:#fff}
.tsact{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.tsact .b{border:1px solid var(--line2)}
/* 菜单 */
.mm{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.mm .mh{flex-basis:100%;font-size:12px;color:var(--ink2)}
.mm .b{border:1px solid var(--line2);height:32px}
.mm .b.on{background:var(--btn-on);color:var(--btn-on-ink)}
.mm select{height:32px;flex:1;min-width:140px}
.m-only{display:none}
/* 手机 */
body.mobile .top>.grp:not(.m-only){display:none}
body.mobile .top .m-only{display:flex;border-left:0;margin-left:auto}
body.mobile .top{flex-wrap:nowrap;padding:4px 6px}
body.mobile .top .b{height:32px;padding:0 8px}
body.mobile .sync{flex:1;min-width:0;max-width:none;white-space:nowrap}
body.mobile #lbody input,body.mobile #lbody .c{pointer-events:none}
body.mobile #lbody .row,body.mobile #lbody .tog{pointer-events:auto}
body.mobile #lbody .c.name{pointer-events:auto}
body.mobile #lbody .c.name input{pointer-events:none}
body.mobile #split{width:5px}
body.mobile .rz,body.mobile .h{display:none}
body.mobile [data-bar]{touch-action:auto;cursor:pointer}
body.mobile .bbar{flex-wrap:nowrap;overflow-x:auto}
@media (max-width:760px){
  .modal{align-items:flex-end;padding:0}
  .mbox{max-width:none;border-radius:14px 14px 0 0;max-height:90vh;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
  .tsf input:not([type=checkbox]),.tsf textarea,.mbox input,.mbox select,.mbox textarea{font-size:16px!important}
  .mbox .pa .b{height:38px;padding:0 14px}

}

function validYear(n) { const y = parts(n).y; return y >= 1990 && y <= 2100; }
function commitField(id, f, v) {
  const t = byId(id); if (!t) return;
  mut(() => {
    switch (f) {

      case 'start': {

        const ns = snapWork(s); if (ns !== s) toast('开始日期不是工作日，已顺延到 ' + toStr(ns));
        const w = wdCount(toNum(t.start), toNum(t.end));

      }

}
function depText(id, side) {

}

  const side = f === 'pred' ? 'to' : 'from', T = S.tasks, parsed = [], bad = [];
  for (const tok of v.split(/[,，;；、\s]+/).filter(Boolean)) {
    const m = /^(\d+)(FS|SS|FF|SF)?([+-]\d+)?[dD天]?$/i.exec(tok);
    if (!m) { bad.push(tok); continue; }
    const other = T[+m[1] - 1];
    if (!other || other.id === id) { bad.push(tok); continue; }
    parsed.push({ from: side === 'to' ? other.id : id, to: side === 'to' ? id : other.id, type: (m[2] || 'FS').toUpperCase(), lag: m[3] ? parseInt(m[3], 10) : 0 });
  }
  const keep = S.deps.filter(d => d[side] !== id), out = [];
  for (const p of parsed) {

    if (err) { bad.push(D[p.from === id ? p.to : p.from].row + '（' + err + '）'); continue; }
    out.push(p);
  }

}

/* ---------- rendering: chart ---------- */
function computeRange() {
  const sc = SC[S.view.scale];
  let lo = TODAY, hi = TODAY;
  for (const t of S.tasks) { const d = D[t.id]; if (d) { lo = Math.min(lo, d.s); hi = Math.max(hi, d.e); } }
  if (S.budget && S.budget.on) for (const r of S.budget.rows) for (const k in r.v) { const n = toNum(k + '-01'); lo = Math.min(lo, n); hi = Math.max(hi, uNext(n, 'month') - 1); }
  const al = sc.align || sc.top;
  const d0 = uStart(lo - sc.pad, al);

  const minW = (rscroll.clientWidth || 800) + 60;
  while ((d1 - d0) * sc.ppd < minW) d1 = uNext(d1, al);
  return { d0, d1, ppd: sc.ppd, sc };
}
function geom(id) {
  const d = D[id], y = d.vr * RH, x1 = (d.s - G.d0) * G.ppd;
  if (d.ms) { const cx = x1 + G.ppd / 2; return { ms: true, cx, cy: y + RH / 2, x1: cx - 8, x2: cx + 8, y }; }
  const x2 = Math.max((d.e + 1 - G.d0) * G.ppd, x1 + 3);

}

  const out = fromEnd ? 1 : -1, inDir = toEnd ? -1 : 1, g = 10;
  const ax = xs + out * g, cx = xe - inDir * g;

    if ((out === 1 && cx >= ax) || (out === -1 && cx <= ax)) return `M${xs},${ys}H${ax}V${ye}H${xe}`;
    const my = ye > ys ? B.y : B.y + RH;

// 各解析器统一返回 { title, tasks:[{key,name,level,start,end,dur,prog,ms,owner,note}], deps:[{from,to,type,lag}], warn:[] }
// start/end 为 'YYYY-MM-DD' 或空串；level 从 0 开始；dur 为工作日数（仅在缺少完成日期时使用）
const IMP = (() => {
  const pad2 = n => String(n).padStart(2, '0');
  const isoDay = (y, m, d) => {
    const dt = new Date(Date.UTC(y, m - 1, d));
    if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return '';

  };
  function parseDateAny(v) {
    const s = String(v ?? '').trim(); if (!s || /^(NA|N\/A|无|—|-)$/i.test(s)) return '';
    let m = /(\d{4})\s*[-/.年]\s*(\d{1,2})\s*[-/.月]\s*(\d{1,2})/.exec(s);
    if (m) return isoDay(+m[1], +m[2], +m[3]);
    m = /(\d{1,2})\s*[/.-]\s*(\d{1,2})\s*[/.-]\s*(\d{2,4})\b/.exec(s);
    if (m) {
      let a = +m[1], b = +m[2], y = +m[3]; if (y < 100) y += y < 70 ? 2000 : 1900;
      return a > 12 ? isoDay(y, b, a) : isoDay(y, a, b); // 默认 月/日/年，首位 >12 时按 日/月/年
    }
    m = /(\d{1,2})\s*月\s*(\d{1,2})\s*日/.exec(s);
    if (m) return isoDay(new Date().getFullYear(), +m[1], +m[2]);
    if (/^\d{5}(\.\d+)?$/.test(s)) { // Excel 序列号
      const dt = new Date(Date.UTC(1899, 11, 30) + Math.floor(+s) * 864e5);
      return isoDay(dt.getUTCFullYear(), dt.getUTCMonth() + 1, dt.getUTCDate());
    }
    return '';
  }
  const TYPE_BY_CODE = { 0: 'FF', 1: 'FS', 2: 'SF', 3: 'SS' }; // MS Project / 亿图 的连线类型编号
  // 延隔：以 0.1 分钟为单位，按每天 480 分钟折算成天
  const lagDays = (v, fmt) => { const n = +v || 0; if (fmt === 19 || fmt === 20 || fmt === 51 || fmt === 52) return 0; return Math.round(n / 4800); };

  /* ---- 文本解码 ---- */
  function decodeText(u8) {
    if (u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) return new TextDecoder('utf-8').decode(u8.subarray(3));
    if (u8[0] === 0xFF && u8[1] === 0xFE) return new TextDecoder('utf-16le').decode(u8.subarray(2));
    if (u8[0] === 0xFE && u8[1] === 0xFF) return new TextDecoder('utf-16be').decode(u8.subarray(2));
    try { return new TextDecoder('utf-8', { fatal: true }).decode(u8); }
    catch (e) { try { return new TextDecoder('gb18030').decode(u8); } catch (e2) { return new TextDecoder('utf-8').decode(u8); } }

  /* ---- ZIP（.edpx 是 zip 包） ---- */
  async function inflateRaw(u8) {
    if (typeof DecompressionStream === 'undefined') throw new Error('浏览器不支持解压，请使用新版 Chrome / Edge / Firefox / Safari');
    const ds = new DecompressionStream('deflate-raw');
    const out = new Response(new Blob([u8]).stream().pipeThrough(ds));
    return new Uint8Array(await out.arrayBuffer());
  }
  async function unzip(u8) {

    let e = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
    if (e < 0) throw new Error('不是有效的 zip 文件');
    const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true);
    const files = {};
    for (let k = 0; k < n && dv.getUint32(p, true) === 0x02014b50; k++) {

        if (f.method === 8) return inflateRaw(raw);

      },
    };

  /* ---- 亿图项目管理 .edpx ---- */
  async function parseEdpx(u8, fileName) {
    const z = await unzip(u8);
    const docName = z.names.find(n => /(^|\/)document\.xml$/i.test(n));
    if (!docName) throw new Error('文件里没有 document.xml，不是亿图项目文件');
    const xml = new DOMParser().parseFromString(decodeText(await z.get(docName)), 'application/xml');

    const tasksEl = kid(root, 'Tasks'); if (!tasksEl) return out;

      const uid = val(t, 'UID'), start = parseDateAny(val(t, 'Start')), end = parseDateAny(val(t, 'Finish'));
      out.tasks.push({ key: uid, name: val(t, 'Name'), level: lvl - 1, start, end: end || start, prog: +val(t, 'PercentComplete') || 0,
        ms: val(t, 'Milestone') === '1', owner: (own[uid] || []).join('; '), note: val(t, 'Notes').replace(/\r\n?/g, '\n').trim() });
      for (const pl of t.children) if (pl.localName === 'PredecessorLink' && val(pl, 'CrossProject') !== '1')
        out.deps.push({ from: val(pl, 'PredecessorUID'), to: uid, type: TYPE_BY_CODE[+val(pl, 'Type')] || 'FS', lag: lagDays(val(pl, 'LinkLag'), +val(pl, 'LagFormat')) });
    }

  }

    const emit = t => { if (skip) return; flush(); out += t; };

  function parseMpp(u8, fileName) {

    const tMeta = fixedMeta(G('TBkndTask/FixedMeta')), tData = fixedData(tMeta, G('TBkndTask/FixedData'));

    const rows = [], seen = new Set();
    tData.forEach((d, k) => {
      if (!d || d.length < minFix) return;

    for (const r of taskRows) {
      const ms = r.dur === 0 && r.start === r.end;
      out.tasks.push({ key: r.uid, name: r.name, level: r.lvl - 1, start: r.start, end: r.end, prog: r.prog, ms, owner: (owners[r.uid] || []).join('; '), note: r.note });

        out.deps.push({ from: a, to: b, type: TYPE_BY_CODE[u16(d, 12)] || 'FS', lag: lagDays(i32(d, 14), u16(d, 18)) });
      });
    } catch (e) { out.warn.push('任务关系读取失败'); }
    return out;
  }

        owner: get(r, 'owner').split(/[;；,，、]/).map(s => s.trim()).filter(Boolean).join('; '), note: get(r, 'note'), _pred: get(r, 'pred'), _succ: get(r, 'succ') });

$('#lblSel').addEventListener('change', e => { S.view.labels = e.target.value; saveLocal(); renderChrome(); e.target.blur(); });

function setScale(k) {
  const cw = rscroll.clientWidth;
  const center = G.d0 != null ? G.d0 + (rscroll.scrollLeft + cw / 2) / G.ppd : TODAY;
  S.view.scale = k; saveLocal(); render();
  rscroll.scrollLeft = (center - G.d0) * G.ppd - cw / 2;
}
function jumpToday() { rscroll.scrollLeft = (TODAY - G.d0) * G.ppd - rscroll.clientWidth / 3; }
function goToday() { rscroll.scrollTo({ left: (TODAY - G.d0) * G.ppd - rscroll.clientWidth / 3, behavior: 'smooth' }); }

document.addEventListener('keydown', e => {
  const m = e.ctrlKey || e.metaKey, kk = e.key.toLowerCase();
  if (m && kk === 's') { e.preventDefault(); doSave(e.shiftKey); return; }
  if (m && kk === 'o') { e.preventDefault(); doOpen(); return; }
  if (m && kk === 'p') { e.preventDefault(); openPdf(); return; }
  if (e.key === 'Escape') { if (!modal.hidden) return closeModal(); if (!pop.hidden) return closePop(); if (linkMode) return setLink(false); }
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) || !modal.hidden) return;
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); }
  else if (mod && k === 'y') { e.preventDefault(); doRedo(); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && sel != null) { e.preventDefault(); delTask(sel); }
  else if (e.key === 'Enter' && sel != null) { e.preventDefault(); const el = lbody.querySelector(`.row[data-id="${sel}"] [data-f="name"]`); el && el.focus(); }
});

/* ---------- scroll sync & splitter ---------- */
lscroll.addEventListener('scroll', () => { if (Math.abs(rscroll.scrollTop - lscroll.scrollTop) > 1) rscroll.scrollTop = lscroll.scrollTop; }, { passive: true });
function stickTop() {
  const sl = rscroll.scrollLeft;
  rhead.querySelectorAll('.tt').forEach(t => {
    const a = +t.dataset.a, b = +t.dataset.b, w = t.getComputedTextLength ? t.getComputedTextLength() : 60;
    t.setAttribute('x', Math.max(a + 8, Math.min(sl + 8, b - w - 8)));
  });
}
rscroll.addEventListener('scroll', stickTop, { passive: true });
rscroll.addEventListener('scroll', () => { if (Math.abs(lscroll.scrollTop - rscroll.scrollTop) > 1) lscroll.scrollTop = rscroll.scrollTop; }, { passive: true });
const split = $('#split');
split.addEventListener('pointerdown', e => {
  split.setPointerCapture(e.pointerId);
  const m = $('#main').getBoundingClientRect();
  const mv = ev => { const w = Math.max(120, Math.min(m.width - 120, ev.clientX - m.left)); $('#left').style.width = w + 'px'; S.view.leftW = Math.round(w); $('#budget').style.setProperty('--blw', (w + 7) + 'px'); };
  const up = () => { split.removeEventListener('pointermove', mv); split.removeEventListener('pointerup', up); saveLocal(); renderRight(); renderBudget(); };
  split.addEventListener('pointermove', mv); split.addEventListener('pointerup', up);
});
let lastW = 0;
new ResizeObserver(() => { const w = rscroll.clientWidth; if (Math.abs(w - lastW) > 20) { lastW = w; requestRender(); } }).observe(rscroll);

/* ---------- start ---------- */
/* ---------- 可调列宽（任务、负责人、备注） ---------- */
const RESIZABLE = { name: [120, 900], owner: [60, 600], note: [60, 1200] };
function colW(k) {
  const c = COLS.find(x => x[0] === k), w = S.view.colW && S.view.colW[k], fsz = (S.font && S.font.size) || 12;
  if (!RESIZABLE[k] && fsz !== 12) return Math.round(c[2] * (k === 'num' ? 1 : (1 + (fsz - 12) * 0.08))); return RESIZABLE[k] && w ? Math.max(RESIZABLE[k][0], Math.min(RESIZABLE[k][1], w)) : c[2]; }
function applyCols() { lscroll.style.setProperty('--cols', COLS.map(c => colW(c[0]) + 'px').join(' ')); }
function fitCol(k) {
  const cv = fitCol.cv || (fitCol.cv = document.createElement('canvas').getContext('2d'));
  const probe = lbody.querySelector(`[data-f="${k}"]`), cs = probe ? getComputedStyle(probe) : getComputedStyle(document.body);
  let max = 0;
  for (const t of S.tasks) {
    const d = D[t.id]; if (!d || !d.vis) continue;
    cv.font = (k === 'name' && d.kid ? '650 ' : cs.fontWeight + ' ') + cs.fontSize + ' ' + cs.fontFamily;
    const txt = k === 'note' ? noteLine(t.note) : t[k] || '';
    max = Math.max(max, cv.measureText(txt).width + (k === 'name' ? t.level * 18 + 24 : 0));
  }
  return max ? Math.ceil(max + 22) : COLS.find(x => x[0] === k)[2]; // 整列为空时恢复默认宽度
}
$('#lhead').innerHTML = COLS.map(c => `<div class="hc"${c[0] === 'owner' ? ' id="ownerHead"' : c[0] === 'prog' ? ' id="progHead"' : ''}>` +
  (c[0] === 'owner' ? `<span class="hl">${c[1]}</span><button class="hf" data-act="ofilter" title="按负责人筛选">▼</button>` :
   c[0] === 'prog' ? `<span class="hl">${c[1]}</span><button class="hf" data-act="pfilter" title="按进度筛选">▼</button>` : c[1]) +
  `${RESIZABLE[c[0]] ? `<span class="rz" data-col="${c[0]}" title="拖动调整宽度，双击自动适应内容"></span>` : ''}</div>`).join('');
$('#lhead').addEventListener('click', e => {
  const b = e.target.closest('[data-act="ofilter"]'); if (b) { e.stopPropagation(); openFilterPop(b); return; }
  const p = e.target.closest('[data-act="pfilter"]'); if (p) { e.stopPropagation(); openProgPop(p); }
});
applyCols();
applyFont();
$('#lhead').addEventListener('pointerdown', e => {
  const h = e.target.closest('.rz'); if (!h || e.button > 0) return;
  e.preventDefault(); e.stopPropagation();
  const k = h.dataset.col, x0 = e.clientX, w0 = colW(k);
  try { h.setPointerCapture(e.pointerId); } catch (_) {} h.classList.add('on'); document.body.classList.add('colresize');
  S.view.colW = Object.assign({}, S.view.colW);
  const mv = ev => { S.view.colW[k] = Math.max(RESIZABLE[k][0], Math.min(RESIZABLE[k][1], Math.round(w0 + ev.clientX - x0))); applyCols(); };
  const up = () => { h.removeEventListener('pointermove', mv); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
    h.classList.remove('on'); document.body.classList.remove('colresize'); saveLocal(); };
  h.addEventListener('pointermove', mv); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
});
$('#lhead').addEventListener('dblclick', e => {
  const h = e.target.closest('.rz'); if (!h) return;
  const k = h.dataset.col; S.view.colW = Object.assign({}, S.view.colW, { [k]: Math.max(fitCol(k), RESIZABLE[k][0]) });
  applyCols(); saveLocal();
});
$('#ltype').value = linkType;
autoSchedule();
render();
lastW = rscroll.clientWidth;
rscroll.scrollLeft = (TODAY - G.d0) * G.ppd - rscroll.clientWidth / 3;
restoreLast();
if (S.cloud && ghReady()) setTimeout(() => cloudSync(true), 600);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
addEventListener('beforeunload', e => { if (S.cloud && !cloudDirty() && !fileHandle) return; if (isDirty() && !fileHandle && !(S.cloud && ghReady())) { e.preventDefault(); e.returnValue = ''; } else if (isDirty()) flushAutosave(); });
addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
addEventListener('drop', async e => {
  e.preventDefault();
  const it = e.dataTransfer.items && e.dataTransfer.items[0]; if (!it || it.kind !== 'file') return;
  if (!confirmDiscard()) return;
  try {
    if (it.getAsFileSystemHandle) { const h = await it.getAsFileSystemHandle(); if (h && h.kind === 'file' && isProjectFile(h.name)) return openHandle(h); }
    const f = it.getAsFile(); if (!isProjectFile(f.name)) return importFile(f);
    loadProject(await f.text(), f.name); setFile(null, f.name); renderChrome();
  } catch (err) { toast('无法打开：' + err.message); }
});
})();
</script>
</body>
</html>
